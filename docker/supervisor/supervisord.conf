[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; ---------------------------------------------------------------------------
; Web server
; ---------------------------------------------------------------------------

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=true
priority=10
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Queue worker - matikan dengan RUN_QUEUE=false
; --max-time=3600 : worker keluar tiap 1 jam, supervisor start ulang
;                   (cegah memory leak & pakai kode terbaru setelah deploy)
; stopwaitsecs    : beri waktu job yang sedang jalan selesai saat container stop
; ---------------------------------------------------------------------------

[program:queue]
command=php /var/www/html/artisan queue:work --tries=3 --max-time=3600 --sleep=3 --no-interaction
directory=/var/www/html
user=app
numprocs=%(ENV_QUEUE_WORKERS)s
process_name=%(program_name)s_%(process_num)02d
autostart=%(ENV_RUN_QUEUE)s
autorestart=true
priority=30
startretries=10
stopsignal=TERM
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Scheduler - nyalakan dengan RUN_SCHEDULER=true
; Belum perlu selama app/Console/Kernel.php masih kosong.
; ---------------------------------------------------------------------------

[program:scheduler]
command=php /var/www/html/artisan schedule:work --no-interaction
directory=/var/www/html
user=app
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
priority=40
startretries=10
stopsignal=TERM
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
