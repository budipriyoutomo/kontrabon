user  app;
worker_processes  auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout  65;

    client_max_body_size 32M;

    # Terjemahkan X-Forwarded-Proto dari nginx-proxy-manager ke param HTTPS
    # untuk php-fpm. Wajib pakai map: nilai mentah "http" juga dianggap ON
    # oleh PHP karena string-nya tidak kosong.
    map $http_x_forwarded_proto $fastcgi_https {
        default   "";
        "https"   on;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    include /etc/nginx/http.d/*.conf;
}
